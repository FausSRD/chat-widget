<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget Demo</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Use standard reCAPTCHA script without explicit render -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="container">
        <h1>Chat Widget Demo</h1>
        <p>This is at widget. Click the chat icon in the bottom right to start.</p>
    </div>

    <!-- Chat Widget Configuration -->
    <script>
        window.ChatWidgetConfig = {
            title: 'Chat with Text',
            welcomeMessage: "Howdy! I\'m Tex. Looking for tractors, mowers, or side-by-sides?",
            quickReplies: ['Show me zero-turn mowers', 'Do you have tractors in stock?', 'How does financing work?'],
            fontFamily: "Arial",
            hintPosition: 'top' ? 'bottom: 90px; right: 20px;' : 'bottom: 20px; right: 90px;',
            hintMessage: 'Need help? Chat with Tex!',
            chatBackgroundColor: '#f8f8f8',                // fondo chat sutil gris claro
            inputBorder: '#d1d5db',                        // borde input gris normal
            inputBorderHover: '#c8102e',                   // foco = rojo del sitio
            inputBackgroundColor: '#ffffff',               // caja texto blanca limpia
            headerColor: '#000000',                        // header negro como el sitio
            messageColor: '#000000',                       // mensajes usuario: rojo texano fuerte (ya está bien)
            messageTextColor: '#ffffff',                  // texto en mensajes usuario = blanco
            botMessageColor: '#f0f4f8',                    // mensajes bot: azul-gris muy claro (o #ffffff con tinte) → se distingue sin ser fuerte
            botMessageTextColor: '#1f2937',               // texto bot = gris oscuro legible
            sendButtonColor: '#000000',                    // botón send = rojo fuerte
            sendButtonIconColor: '#ffffff',                // ícono flecha = blanco (arregla lo feo del negro)
            sendButtonHooverColor: '#e53935',              // hover = rojo más vivo
            buttonIconColor: '#000000',  // COLOR DEL BOTON?... NO SE PORQUE ESTE NOMBRE                  // otros iconos = rojo
            activateMic: 'false',
            inputMessagePlaceHolder: 'Ask me anything...',
            launcherImage :'https://lhai-chat-widget-pre.up.railway.app/assets/tex.png',
            launcherImageSize: '90px',
        }; 
    </script>
    <!-- <script src="https://lhai-chat-widget-pre.up.railway.app/chat-widget-golden.js"></script> -->
    <!-- <script src="https://lhai-chat-widget-pre.up.railway.app/internal-widget-company.js"></script> -->
    <script src="chat-widget.js"></script>
    <!-- <script src="internal-widget-company.js"></script> -->
</body>
</html>
